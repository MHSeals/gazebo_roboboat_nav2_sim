# WIDE CONTROL COURSE -- generated by tools/make_wide_course.py, do not hand-edit.
#
# Derived from course_default.yaml with exactly two changes:
#   1. every channel gate widened to 6.0 m (positions and headings untouched,
#      so path length, turn angles and turn radii are identical to the shipped
#      course and elapsed time is directly comparable);
#   2. free-standing buoys removed, except the sprint mark and obstacle.
#
# The point is to put the driving line outside the inflation field entirely:
# 5.6 m of free water, 0.60 m padded half-beam, so 2.2 m of hull-to-surface
# against a 1.30 m inflation_radius. Running the SHIPPED config here separates
# "the controller is mistuned" from "the course keeps inflated water inside
# MPPI's horizon".
#
# The task is named channel_wide so it can never be confused with the frozen
# `channel` contract in tuning/regression_channel.json.
# RoboBoat-style course description.
#
# Consumed by scripts/gen_course.py, which emits a Gazebo Harmonic world.
# Everything here is visual-only geometry: buoys have no collision by default
# because the GPU lidar rasterises *visuals*, so skipping collision removes
# the entire broadphase/narrowphase cost from the physics loop.
#
# Regenerate after editing:
#   ros2 run roboboat_description gen_course.py \
#     --course <this file> --output <ws>/src/roboboat_description/worlds/roboboat_course.sdf

world:
  name: roboboat_course
  # 5 ms step is plenty: nothing in this world has contact or constraint
  # dynamics. Raise real_time_factor to run the nav stack faster than
  # wall-clock (0.0 = unthrottled; see docs/architecture.md).
  max_step_size: 0.005
  real_time_factor: 1.0
  water_size: 260.0
  # RoboBoat is held at Nathan Benderson Park, Sarasota FL. Only matters for
  # the NavSat sensor's absolute fix.
  latitude_deg: 27.3872
  longitude_deg: -82.4590
  elevation_m: 3.0
  # Set true if you later add a task that needs physical contact.
  buoy_collision: false
  # Height of the boat's single-plane lidar above the waterline. Must match
  # lidar_z in roboboat.urdf.xacro. gen_course.py refuses to emit a world
  # containing an obstacle this plane would slice too thinly (or miss).
  lidar_plane_z: 0.35
  lidar_plane_margin: 0.10

# Buoys are deliberately taller than real RoboBoat marks. On the water you
# would detect these with a 3D lidar and a camera; here a single scan plane
# stands in for that whole perception stack, and its *output* -- a ring of
# obstacle points -- is what Nav2 consumes either way.
#
# z_center is the geometry's centre height above the waterline.
# Radii are the real competition hardware; heights are not. Radius is what
# navigation actually consumes -- it sets a gate's free water and therefore the
# clearance the controller has to work with -- so it is worth getting right.
# Height only decides whether the scan plane sees the buoy at all, and the real
# marks are far too short for a plane at 0.35 m (an A-0 stands 0.15 m above the
# water). On the water you would detect these with a 3D lidar and a camera;
# here one scan plane stands in for that whole stack, and its *output* -- a
# ring of obstacle points -- is what Nav2 consumes either way.
#
# Sources: RoboBoat 2026 Team Handbook pp.47, 49, 51.
buoy_types:
  # Task 1 lateral markers: Taylor Made Sur-Mark 950410 / 950400, 18 in dia.
  red:    {shape: cylinder, radius: 0.20, height: 0.90, z_center: 0.20, color: [0.85, 0.10, 0.10]}
  green:  {shape: cylinder, radius: 0.20, height: 0.90, z_center: 0.20, color: [0.10, 0.70, 0.25]}
  yellow: {shape: sphere,   radius: 0.30,                z_center: 0.30, color: [0.95, 0.85, 0.10]}
  black:  {shape: sphere,   radius: 0.30,                z_center: 0.30, color: [0.08, 0.08, 0.08]}
  white:  {shape: cylinder, radius: 0.25, height: 1.10, z_center: 0.25, color: [0.95, 0.95, 0.95]}
  blue:   {shape: cylinder, radius: 0.25, height: 1.10, z_center: 0.25, color: [0.10, 0.30, 0.90]}
  # Task 3 marks: Polyform A-2, 36.8 cm dia, 1 ft above water.
  red_a2:    {shape: cylinder, radius: 0.184, height: 0.90, z_center: 0.20, color: [0.85, 0.10, 0.10]}
  green_a2:  {shape: cylinder, radius: 0.184, height: 0.90, z_center: 0.20, color: [0.10, 0.70, 0.25]}
  yellow_a2: {shape: cylinder, radius: 0.184, height: 0.90, z_center: 0.20, color: [0.95, 0.85, 0.10]}
  black_a2:  {shape: cylinder, radius: 0.184, height: 0.90, z_center: 0.20, color: [0.08, 0.08, 0.08]}
  # Task 2 marks: Polyform A-0, 20.3 cm dia, 0.5 ft above water.
  red_a0:    {shape: cylinder, radius: 0.102, height: 0.90, z_center: 0.20, color: [0.85, 0.10, 0.10]}
  green_a0:  {shape: cylinder, radius: 0.102, height: 0.90, z_center: 0.20, color: [0.10, 0.70, 0.25]}
  black_a0:  {shape: cylinder, radius: 0.102, height: 0.90, z_center: 0.20, color: [0.08, 0.08, 0.08]}

# A gate expands into two buoys straddling (x, y), separated by `width`,
# perpendicular to `heading_deg`. Convention: traversing along +heading,
# `right` is to starboard and `left` is to port (IALA-B, red-right-returning).
gates:
  - {name: start,      x:   6.0, y:   0.0, heading_deg:   0.0, width: 6.0, right: red, left: green}
  - {name: chan_a,     x:  14.0, y:   1.0, heading_deg:  12.0, width: 6.0, right: red, left: green}
  - {name: chan_b,     x:  22.0, y:   3.4, heading_deg:  22.0, width: 6.0, right: red, left: green}
  - {name: chan_c,     x:  30.0, y:   7.6, heading_deg:  40.0, width: 6.0, right: red, left: green}
  - {name: chan_d,     x:  35.5, y:  14.0, heading_deg:  70.0, width: 6.0, right: red, left: green}
  - {name: speed_in,   x:  36.5, y:  22.0, heading_deg:  92.0, width: 6.0, right: red, left: green}
  - {name: speed_out,  x:  30.0, y:  31.0, heading_deg: 140.0, width: 6.0, right: red, left: green}
  - {name: return_a,   x:  20.0, y:  34.0, heading_deg: 172.0, width: 6.0, right: red, left: green}
  - {name: return_b,   x:  10.0, y:  33.0, heading_deg: 192.0, width: 6.0, right: red, left: green}
  - {name: finish,     x:   1.0, y:  29.0, heading_deg: 215.0, width: 6.0, right: red, left: green}
  # Task 3, Emergency Response Sprint. Entrance gate only -- the task is
  # entered and exited through the same pair. Placed in the empty water south
  # of the channel rather than woven into it: the channel's ten gates are a
  # verified 10/10 result and moving any of them would invalidate it for no
  # gain. Width 2.4 m sits inside the documented 6-10 ft (1.83-3.05 m).
  - {name: sprint_gate, x: 10.0, y: -6.0, heading_deg: -90.0, width: 2.4, right: red_a2, left: green_a2}

# Free-standing obstacles scattered through the course.
buoys:
  # Task 3 marks. Appended, never inserted: the SDF model name of an unnamed
  # buoy carries its index, so inserting one renumbers every buoy after it and
  # quietly invalidates the obstacle indices in every archived trace.
  #
  # 13.0 m from the entrance gate, inside the documented 40-100 ft
  # (12.2-30.5 m). The black obstacle sits inside the loop, as the task
  # specifies, 1.5 m off the mark -- so a 4.0 m ring clears it by 1.77 m of
  # hull-to-surface and the boat cannot simply drive the tightest circle it
  # can find.
  - {name: sprint_mark,     type: yellow_a2, x: 10.0, y: -19.0}
  - {name: sprint_obstacle, type: black_a2,  x: 11.5, y: -19.0}

# Rectangular walls, e.g. the docking bay. Visual boxes, axis-aligned about
# their own yaw.
# Task 5, Navigate the Marina. Two docks, three numbered slips each, at the
# dimensions given in the 2026 Team Handbook fig. p.55 and table p.56:
#
#   slip clear opening   60 in  = 1.52 m
#   dock overall         120 in x 340 in = 3.05 m x 8.64 m
#   spine module          40 in wide = 1.02 m
#   tine length          4-7 ft; 6 ft = 1.83 m used here
#   cube module           20 x 20 x 16 in, so tines are 0.51 m thick
#
# Tine pitch follows from the numbers rather than being chosen: a 1.52 m clear
# opening between 0.51 m tines is a 2.03 m pitch, and four tines span 6.60 m of
# the 8.64 m spine.
#
# READ THIS BEFORE WRITING A DOCKING TASK. A 1.52 m slip against a 1.10 m beam
# leaves 0.21 m a side, and inflation_radius is 1.30 m -- the entire slip, and
# 1.3 m of the water outside it, is inflated from both tines at once. Nav2 as
# configured cannot plan into one. That is a real finding about the config, not
# a defect in this geometry, and it is why docs/tasks.md puts docking next: it
# is the task that will actually stress the Nav2 configuration.
walls:
  # South dock: spine along y, tines projecting west.
  - {name: dock_s_spine, x: 46.0, y:  3.05, yaw_deg: 90.0, length: 8.64, height: 1.2, thickness: 0.51}
  - {name: dock_s_tine_1, x: 44.75, y: -0.02, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}
  - {name: dock_s_tine_2, x: 44.75, y:  2.01, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}
  - {name: dock_s_tine_3, x: 44.75, y:  4.04, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}
  - {name: dock_s_tine_4, x: 44.75, y:  6.07, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}
  # North dock, 12 m further up the basin, tines projecting west likewise.
  - {name: dock_n_spine, x: 46.0, y: 18.05, yaw_deg: 90.0, length: 8.64, height: 1.2, thickness: 0.51}
  - {name: dock_n_tine_1, x: 44.75, y: 14.98, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}
  - {name: dock_n_tine_2, x: 44.75, y: 17.01, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}
  - {name: dock_n_tine_3, x: 44.75, y: 19.04, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}
  - {name: dock_n_tine_4, x: 44.75, y: 21.07, yaw_deg: 0.0, length: 1.83, height: 1.2, thickness: 0.51}

# Tasks. Each names the course elements it uses and how it is scored; see
# tools/task_run.py for the types and docs/tasks.md for the full task set.
#
# The whole course is in the water at once, as it is at the competition, and a
# task is a selection over it rather than a separate world.
tasks:
  # Navigate the channel. The verified baseline; tuning/regression_channel.json
  # holds it to a contract. Do not reorder or renumber these gates.
  - name: channel_wide
    type: gate_transit
    timeout_s: 420.0
    gates: [start, chan_a, chan_b, chan_c, chan_d, speed_in, speed_out,
            return_a, return_b, finish]

  # Task 3, Emergency Response Sprint. Enter through the gate, ring the yellow
  # mark, come back out through the same gate. Scored on time.
  #
  # Direction is not a property of the course: at the competition a light
  # beacon on top of the mark sets it at run time -- red means circle from the
  # right (counter-clockwise), green means circle from the left (clockwise).
  # Both must work, so this is a parameter and the scorer checks the sign.
  #
  # radius 4.0 m with 8 points gives 3.06 m between waypoints, comfortably
  # more than the sprint tree's 0.8 m goal-retirement radius, so waypoints are
  # retired one at a time and the ring is driven as a ring.
  - name: sprint
    type: circle_mark
    behavior_tree: navigate_sprint_boat.xml
    timeout_s: 300.0
    gate: sprint_gate
    mark: sprint_mark
    direction: ccw
    laps: 1
    radius: 4.0
    points: 8
    standoff: 3.0

  # The same task with the beacon showing the other colour. It is a separate
  # declaration only so both directions can be run; on the water this is the
  # same task and the direction is not known until the run starts, so a
  # configuration that only works one way round is not a working configuration.
  - name: sprint_cw
    type: circle_mark
    behavior_tree: navigate_sprint_boat.xml
    timeout_s: 300.0
    gate: sprint_gate
    mark: sprint_mark
    direction: cw
    laps: 1
    radius: 4.0
    points: 8
    standoff: 3.0

# Where to drop the boat. Also used by the bringup launch file.
spawn:
  x: 0.0
  y: 0.0
  z: 0.0
  yaw_deg: 0.0

# Camera sensors, emitted only by `gen_course.py --cameras` into a separate
# world. Rendering these costs real time under software rendering, so the
# default world deliberately has none -- they exist to review a headless run
# as Gazebo actually draws it.
#
# Gazebo cameras look along +x; pitch is positive downward.
cameras:
  - name: overhead
    x: 22.0
    y: 17.0
    z: 52.0
    pitch_deg: 90.0
    yaw_deg: 0.0
    hfov: 1.15
    width: 900
    height: 900
    rate: 8
  - name: hero
    x: -14.0
    y: -12.0
    z: 15.0
    pitch_deg: 18.0
    yaw_deg: 38.5
    hfov: 1.25
    width: 1000
    height: 620
    rate: 8
